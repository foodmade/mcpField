# MCP Field 的站点配置：放进服务器自带的 Nginx（/etc/nginx/conf.d/，用 mcpfield nginx 更新），
# 按域名转发到本机的 mcpfield 前端服务（只监听 127.0.0.1:3000）。
# 只监听 443：Cloudflare 用 HTTPS 回源；80 端口是同机其他应用的，http 跳转由 Cloudflare 的 Always Use HTTPS 负责。
# 证书是 Cloudflare 源服务器证书，放在 /storage02/mcpfield/ssl/。

server {
    listen 443 ssl;
    http2 on;
    server_name mcpfield.com www.mcpfield.com;

    ssl_certificate     /storage02/mcpfield/ssl/mcpfield.com.pem;
    ssl_certificate_key /storage02/mcpfield/ssl/mcpfield.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mcpfield.com.access.log;
    error_log  /var/log/nginx/mcpfield.com.error.log;

    # 压缩、缓存头、www 跳转都由 mcpfield 服务自己处理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 管理后台：静态页面（mcp-field-admin/dist，本机构建后同步上来）+ 后台接口（mcpfield-admin-api，只监听 127.0.0.1:3200）。
# 同一张 *.mcpfield.com 源服务器证书；后台不让搜索引擎收录
server {
    listen 443 ssl;
    http2 on;
    server_name admin.mcpfield.com;

    ssl_certificate     /storage02/mcpfield/ssl/mcpfield.com.pem;
    ssl_certificate_key /storage02/mcpfield/ssl/mcpfield.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/admin.mcpfield.com.access.log;
    error_log  /var/log/nginx/admin.mcpfield.com.error.log;

    root /storage02/mcpfield/app/mcp-field-admin/dist;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/admin/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        client_max_body_size 64k;
    }

    # 博客：文章正文（Markdown）和图片上传需要更大的请求体（接口自己限制正文 2 MB、图片 8 MB）
    location /api/admin/blog/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        client_max_body_size 10m;
    }

    # 带哈希的构建产物长期缓存；页面本身每次重新获取（用 expires 而不是 add_header：location 里写 add_header 会丢掉上面的安全头）
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
