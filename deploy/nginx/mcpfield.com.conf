# MCP Field 的站点配置：放进服务器上 bytor-website 容器的 Nginx（它占用着 80/443），
# 按域名转发到宿主机上的 mcpfield 前端服务（只监听 127.0.0.1 和 docker0 网桥 172.17.0.1）。
# 证书是 Cloudflare 源服务器证书，放在 /data/bytro/ssl/（容器内 /etc/nginx/ssl/）。

server {
    listen 80;
    server_name mcpfield.com www.mcpfield.com;
    return 301 https://mcpfield.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcpfield.com www.mcpfield.com;

    ssl_certificate     /etc/nginx/ssl/mcpfield.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mcpfield.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 压缩、缓存头、www 跳转都由 mcpfield 服务自己处理
    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
